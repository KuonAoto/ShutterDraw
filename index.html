<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>軌跡連動シャッター露光ジェネレーター</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1e1e24;
      --accent-color: #007aff;
      --accent-hover: #0056b3;
      --text-color: #f0f0f5;
      --border-color: #33333d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    header p {
      font-size: 0.85rem;
      color: #aaa;
      margin-top: 5px;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .workspace {
      position: relative;
      background-color: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 400px;
      user-select: none;
    }

    .canvas-container {
      position: relative;
      display: inline-block;
      max-width: 100%;
      max-height: 70vh;
    }

    canvas {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }

    /* 描画レイヤーと背景レイヤーの重ね合わせ */
    #imageCanvas {
      position: relative;
      z-index: 1;
    }

    #drawCanvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      cursor: crosshair;
    }

    .upload-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #888;
      cursor: pointer;
      padding: 40px;
    }

    .upload-placeholder svg {
      width: 48px;
      height: 48px;
      fill: currentColor;
    }

    .controls {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .control-group label {
      color: #ccc;
    }

    input[type="range"] {
      accent-color: var(--accent-color);
    }

    .btn {
      background-color: #2c2c35;
      color: #fff;
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background-color: #3a3a46;
    }

    .btn-primary {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .btn-twitter {
      background-color: #1da1f2;
      border-color: #1da1f2;
    }

    .btn-twitter:hover {
      background-color: #0c85d0;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #fileInput {
      display: none;
    }

    .status-text {
      font-size: 0.85rem;
      color: #00ff88;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <header>
    <h1>軌跡ブレ長露光ジェネレーター</h1>
    <p>画像をアップロードし、マウスや指でなぞった軌跡（手振れ）に合わせて全体をブレさせます。</p>
  </header>

  <div class="container">
    <div class="workspace" id="dropZone">
      <div class="upload-placeholder" id="placeholder" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/>
        </svg>
        <span>クリックまたはドラッグ＆ドロップで画像をアップロード</span>
      </div>

      <div class="canvas-container" id="canvasContainer" style="display: none;">
        <canvas id="imageCanvas"></canvas>
        <canvas id="drawCanvas"></canvas>
      </div>
    </div>

    <input type="file" id="fileInput" accept="image/*">

    <div class="controls">
      <div class="control-row">
        <button class="btn" onclick="document.getElementById('fileInput').click()">画像を変更</button>
        <button class="btn" id="clearStrokeBtn">軌跡をリセット</button>
        <div class="control-group">
          <label for="stepInput">サンプリング密度:</label>
          <input type="range" id="stepInput" min="1" max="10" value="2" title="小さいほどなめらかにブレます">
        </div>
      </div>

      <div class="control-row">
        <button class="btn btn-primary" id="processBtn" disabled>
          長押し露光を実行（軌跡でブレ作成）
        </button>
        <button class="btn" id="downloadBtn" disabled>画像を保存</button>
        <button class="btn btn-twitter" id="twitterBtn" disabled>X (Twitter) で投稿</button>
      </div>

      <div class="status-text" id="statusText"></div>
    </div>
  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const dropZone = document.getElementById('dropZone');
    const placeholder = document.getElementById('placeholder');
    const canvasContainer = document.getElementById('canvasContainer');
    
    const imageCanvas = document.getElementById('imageCanvas');
    const imgCtx = imageCanvas.getContext('2d');
    
    const drawCanvas = document.getElementById('drawCanvas');
    const drawCtx = drawCanvas.getContext('2d');

    const processBtn = document.getElementById('processBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const twitterBtn = document.getElementById('twitterBtn');
    const clearStrokeBtn = document.getElementById('clearStrokeBtn');
    const statusText = document.getElementById('statusText');
    const stepInput = document.getElementById('stepInput');

    let originalImage = null;
    let strokePoints = [];
    let isDrawing = false;
    let isProcessed = false;

    // --- ファイル読み込み処理 ---
    fileInput.addEventListener('change', (e) => {
      if (e.target.files && e.target.files[0]) {
        loadImage(e.target.files[0]);
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--accent-color)';
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.style.borderColor = 'var(--border-color)';
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.style.borderColor = 'var(--border-color)';
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        loadImage(e.dataTransfer.files[0]);
      }
    });

    function loadImage(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          originalImage = img;
          
          // Canvasサイズの設定（オリジナル解像度を保持）
          imageCanvas.width = img.width;
          imageCanvas.height = img.height;
          drawCanvas.width = img.width;
          drawCanvas.height = img.height;

          // 画像の初期描画
          imgCtx.drawImage(img, 0, 0);

          placeholder.style.display = 'none';
          canvasContainer.style.display = 'inline-block';
          
          resetStroke();
          statusText.textContent = "画像の上をドラッグしてカメラの移動軌跡を描いてください。";
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // --- ドローイング（手振れ軌跡の記録）処理 ---
    function getCanvasCoords(e) {
      const rect = drawCanvas.getBoundingClientRect();
      const scaleX = drawCanvas.width / rect.width;
      const scaleY = drawCanvas.height / rect.height;

      let clientX, clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      } else {
        clientX = e.clientX;
        clientY = e.clientY;
      }

      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function startDrawing(e) {
      if (!originalImage) return;
      isDrawing = true;
      resetStroke();
      const pos = getCanvasCoords(e);
      strokePoints.push(pos);
      redrawStroke();
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getCanvasCoords(e);
      strokePoints.push(pos);
      redrawStroke();
    }

    function stopDrawing() {
      if (!isDrawing) return;
      isDrawing = false;
      if (strokePoints.length > 1) {
        processBtn.disabled = false;
        statusText.textContent = "軌跡を記録しました。「長押し露光を実行」を押してください。";
      }
    }

    drawCanvas.addEventListener('mousedown', startDrawing);
    drawCanvas.addEventListener('mousemove', draw);
    window.addEventListener('mouseup', stopDrawing);

    drawCanvas.addEventListener('touchstart', startDrawing, { passive: false });
    drawCanvas.addEventListener('touchmove', draw, { passive: false });
    window.addEventListener('touchend', stopDrawing);

    function redrawStroke() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (strokePoints.length < 2) return;

      drawCtx.beginPath();
      drawCtx.moveTo(strokePoints[0].x, strokePoints[0].y);
      for (let i = 1; i < strokePoints.length; i++) {
        drawCtx.lineTo(strokePoints[i].x, strokePoints[i].y);
      }
      
      // 描画された軌跡を目視しやすく可視化（赤い誘導線）
      drawCtx.strokeStyle = 'rgba(255, 58, 48, 0.8)';
      drawCtx.lineWidth = Math.max(3, Math.min(drawCanvas.width, drawCanvas.height) / 200);
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.stroke();

      // 始点（基準点）を青い丸で強調
      drawCtx.beginPath();
      drawCtx.arc(strokePoints[0].x, strokePoints[0].y, drawCtx.lineWidth * 1.5, 0, Math.PI * 2);
      drawCtx.fillStyle = '#007aff';
      drawCtx.fill();
    }

    function resetStroke() {
      strokePoints = [];
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      if (originalImage) {
        imgCtx.drawImage(originalImage, 0, 0);
      }
      processBtn.disabled = true;
      downloadBtn.disabled = true;
      twitterBtn.disabled = true;
      isProcessed = false;
    }

    clearStrokeBtn.addEventListener('click', () => {
      resetStroke();
      statusText.textContent = "軌跡をクリアしました。再度なぞってください。";
    });

    // --- 長露光・軌跡ブレ演算処理 ---
    processBtn.addEventListener('click', () => {
      if (!originalImage || strokePoints.length < 2) return;

      statusText.textContent = "画像をレンダリング中...";
      
      // 非同期処理でUIフリーズを回避
      setTimeout(() => {
        applyPathBlur();
        statusText.textContent = "長露光（軌跡ブレ）処理が完了しました！";
        downloadBtn.disabled = false;
        twitterBtn.disabled = false;
        isProcessed = true;
      }, 50);
    });

    function applyPathBlur() {
      const width = imageCanvas.width;
      const height = imageCanvas.height;

      // オフスクリーンCanvas（元画像用）
      const offCanvas = document.createElement('canvas');
      offCanvas.width = width;
      offCanvas.height = height;
      const offCtx = offCanvas.getContext('2d');
      offCtx.drawImage(originalImage, 0, 0);
      const srcData = offCtx.getImageData(0, 0, width, height).data;

      // 累積用のFloat32配列（RGBA）
      const accum = new Float32Array(width * height * 4);

      const startPoint = strokePoints[0];
      const step = parseInt(stepInput.value, 10);
      
      // サンプリング対象の点を取得
      const sampledPoints = strokePoints.filter((_, index) => index % step === 0);
      if (sampledPoints[sampledPoints.length - 1] !== strokePoints[strokePoints.length - 1]) {
        sampledPoints.push(strokePoints[strokePoints.length - 1]);
      }

      const count = sampledPoints.length;

      // 各地点でのシフト移動を計算して積算
      for (let i = 0; i < count; i++) {
        const pt = sampledPoints[i];
        // 始点からの移動量 (dx, dy)
        const dx = Math.round(pt.x - startPoint.x);
        const dy = Math.round(pt.y - startPoint.y);

        for (let y = 0; y < height; y++) {
          const targetY = y + dy;
          if (targetY < 0 || targetY >= height) continue;

          for (let x = 0; x < width; x++) {
            const targetX = x + dx;
            if (targetX < 0 || targetX >= width) continue;

            const srcIdx = (y * width + x) * 4;
            const dstIdx = (targetY * width + targetX) * 4;

            accum[dstIdx]     += srcData[srcIdx];     // R
            accum[dstIdx + 1] += srcData[srcIdx + 1]; // G
            accum[dstIdx + 2] += srcData[srcIdx + 2]; // B
            accum[dstIdx + 3] += srcData[srcIdx + 3]; // A
          }
        }
      }

      // 出力用ImageDataを作成して平均化処理
      const outImageData = imgCtx.createImageData(width, height);
      const outData = outImageData.data;
      const totalPixels = width * height * 4;

      for (let i = 0; i < totalPixels; i += 4) {
        outData[i]     = accum[i]     / count; // R
        outData[i + 1] = accum[i + 1] / count; // G
        outData[i + 2] = accum[i + 2] / count; // B
        outData[i + 3] = accum[i + 3] / count; // A
      }

      // 処理結果を描画
      imgCtx.putImageData(outImageData, 0, 0);

      // 処理完了後、オーバーレイしていた赤線を消去
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
    }

    // --- 保存＆シェア機能 ---
    downloadBtn.addEventListener('click', () => {
      if (!isProcessed) return;
      const link = document.createElement('a');
      link.download = 'long_exposure_blur.png';
      link.href = imageCanvas.toDataURL('image/png');
      link.click();
    });

    twitterBtn.addEventListener('click', () => {
      if (!isProcessed) return;

      // X (Twitter) はWeb API直接での画像添付投稿に対応していないため、画像を保存させた上で投稿画面を開きます
      const link = document.createElement('a');
      link.download = 'long_exposure_blur.png';
      link.href = imageCanvas.toDataURL('image/png');
      link.click();

      const tweetText = encodeURIComponent("手振れ・長露光風の画像を作成しました！ #長露光エフェクト #画像加工");
      const twitterUrl = `https://twitter.com/intent/tweet?text=${tweetText}`;
      
      alert("加工画像をダウンロードしました！\n開いたX (Twitter) の投稿画面に画像を貼り付けてシェアしてください。");
      window.open(twitterUrl, '_blank');
    });
  </script>
</body>
</html>
